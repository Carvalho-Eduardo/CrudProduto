
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Sistema de Produtos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .marca {
            color: #2f81f7;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 26px;
        }

        .descricao {
            color: #8b949e;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .menu a {
            display: block;
            padding: 14px 16px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 7px;
            color: #e6edf3;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .menu a:hover {
            background: #292e36;
            border-color: #2f81f7;
            color: #58a6ff;
        }

        .menu a.principal {
            background: #238636;
            border-color: #238636;
            color: #ffffff;
        }

        .menu a.principal:hover {
            background: #2ea043;
        }

        .rodape {
            color: #6e7681;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 26px;
        }

        @media (max-width: 480px) {
            body { padding: 14px; }

            .container {
                padding: 26px 20px;
            }

            h1 { font-size: 23px; }
        }

        @media (max-width: 320px) {
            .container { padding: 22px 14px; }
            h1 { font-size: 21px; }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="marca">Sistema de Estoque</div>

        <h1>Sistema de Produtos</h1>

        <p class="descricao">
            Gerencie seus produtos de forma simples e organizada.
        </p>

        <nav class="menu" aria-label="Menu principal">
            <a href="listar.jsp" class="principal">Listar Produtos</a>
            <a href="cadastrar.jsp">Cadastrar Produto</a>
            <a href="consultar.jsp">Consultar Produto</a>
            <a href="alterar.jsp">Alterar Produto</a>
            <a href="excluir.jsp">Excluir Produto</a>
        </nav>

        <footer class="rodape">
            Sistema desenvolvido com Java, JSP e MySQL
        </footer>

    </main>

</body>
</html>
